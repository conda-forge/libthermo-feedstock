context:
  name: libthermo
  version: "0.4.1"
  python_min: "3.11"

recipe:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/twiinIT/libthermo/archive/refs/tags/${{ version }}.tar.gz
  sha256: 25e9c7dc7c3ce0b208c8a2a61b3a80671384dde58fabfcca1276e458e1246307

build:
  number: 0
  skip: ["osx"]

outputs:
  - package:
      name: libthermo
    build:
      script:
        file: build
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
        - cmake
        - ninja
        - libboost-devel
      host: []
    tests:
      - package_contents:
          include:
            exists:
              - libthermo/version.hpp
      - script:
        - if: unix
          then:
          - test -f ${PREFIX}/lib/cmake/libthermo/libthermoConfig.cmake
        - if: win
          then:
          -  if not exist %LIBRARY_PREFIX%\lib/cmake/libthermo/libthermoConfig.cmake (exit 1)

  - package:
      name: pythermo
    build:
      script: python -m pip install ./pythermo --no-deps --ignore-installed --no-build-isolation --no-cache-dir -vvv
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
        - cmake
        - ninja
        - libthermo
      host:
        - python
        - pip
        - nanobind
        - scikit-build-core
      run:
        - python
    tests:
      - python:
          imports:
            - pythermo.pythermo_core
      - script:
            interpreter: python
            content: |
              import pythermo._version
              assert pythermo._version.__version__ == '${{ version }}'

about:
  homepage: https://github.com/twiinIT/libthermo
  repository: https://github.com/twiinIT/libthermo
  summary: 'A fast C++/Python thermodynamical library'
  description: |
    libthermo is a fast C++ thermodynamical library
    Python bindings are provided in pythermo.
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD

extra:
  recipe-maintainers:
    - adriendelsalle
