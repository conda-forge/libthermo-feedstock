context:
  name: libthermo
  version: 0.4.0
  python_min: "3.12"

package:
  name: libthermo

recipe:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/twiinIT/libthermo/archive/refs/tags/${{ version }}.tar.gz
  sha256: 01388272ae03ecd295c083be012543a9a82b7a22db2dec5a5dc898ccb486771c

build:
  number: 0

outputs:
  - package:
      name: libthermo
    build:
      script:
        file: build
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - libboost-devel
      host: []


  - package:
      name: pythermo
    build:
      script: python -m pip install . --no-deps --ignore-installed --no-build-isolation --no-cache-dir -vvv
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - scikit-build-core
        - libthermo
        - libboost-devel
      host:
        - python-abi3
        - python
        - pip
        - nanobind

about:
  homepage: https://github.com/twiinIT/libthermo
  repository: https://github.com/twiinIT/libthermo
  summary: 'A fast C++/Python thermodynamical library'
  description: |
    libthermo is a fast C++ thermodynamical library
    Python bindings are provided in pythermo.
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD

extra:
  recipe-maintainers:
    - adriendelsalle
